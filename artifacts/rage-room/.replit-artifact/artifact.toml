kind = "web"
previewPath = "/"
title = "Rage Room"
description = "A playful browser smashing game where players choose a tool, destroy breakable room objects, build combos, and fill a rage meter through tactile visual and audio feedback."
version = "1.0.0"
id = "artifacts/rage-room"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25491

[services.development]
run = "pnpm --filter @workspace/rage-room run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rage-room", "run", "build" ]
serve = "static"
publicDir = "artifacts/rage-room/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25491"
BASE_PATH = "/"
